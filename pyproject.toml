[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minusparser"
version = "0.9.0"
description = "High-performance, secure web content discovery and ingestion CLI and MCP server for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "MinusParser Authors" }
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "httpcore>=1.0.0",
    "feedparser>=6.0.0",
    "trafilatura>=1.8.0",
    "beautifulsoup4>=4.12.0",
    "brotli>=1.1.0",
    "click>=8.1.0",
]

[project.scripts]
minusparser = "minusparser.cli:main"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["domain_reader*", "minusparser*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

